# Checkov (IaC static analysis) の設定。
# 実行: make scan-checkov

directory:
  - terraform

framework:
  - terraform

# 1 件あたり 1 行 + ガイド URL のコンパクト表示
compact: true
quiet: true

# .terraform 配下(terraform init で取得した外部モジュール)は自リポジトリの責務外
skip-path:
  - .*/\.terraform/.*

# 検出があっても make は成功扱いにする(現状は検出内容の可視化が目的)。
# CI ゲートとして落としたい場合は false にする。
soft-fail: true

# 除外するチェック。追加する場合は必ず理由コメントを添える。
skip-check:
  # RDS の削除保護は意図的に無効。このサンプルは make clean(terraform destroy)で
  # 環境を破棄する前提のため、有効にすると destroy が失敗する。
  # 実 AWS の永続環境へ適用する場合は有効にすること。
  - CKV_AWS_293

  # app SG の egress 全許可は意図的。ECR からのイメージ取得や外部 API 呼び出しに
  # 必要で、絞るには VPC エンドポイントの用意が前提になりサンプルの範囲を超える。
  # (Trivy 側の AVD-AWS-0104 と同じ判断)
  - CKV_AWS_382

  # KMS による暗号化は未対応。provider.tf の endpoints に KMS が無く(Floci に
  # 向けていない)、aws_kms_key を作ると実 AWS へリクエストが飛んで失敗する。
  # (Trivy 側の AVD-AWS-0017 / AVD-AWS-0078 と同じ判断)
  - CKV_AWS_158  # CloudWatch ロググループの KMS 暗号化
  - CKV_AWS_354  # RDS Performance Insights の KMS CMK

  # 誤検知。app SG は ECS サービスの network_configuration、rds SG は
  # aws_db_instance の vpc_security_group_ids に実際にアタッチされているが、
  # モジュール境界を越えた var.security_group_id の参照を解決できていない。
  - CKV2_AWS_5

  # ECS タスクの public IP 付与は意図的。NAT ゲートウェイも VPC エンドポイントも
  # 持たない構成では、ECR からのイメージ取得にこれが必要になる。
  - CKV_AWS_333
